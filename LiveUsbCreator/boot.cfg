set default=0
set timeout=3

menuentry "WrongWay Tuning Live" {
    search --no-floppy --file --set=root /casper/zz-wrongway.squashfs
    linux /casper/vmlinuz boot=casper persistent username=wrongway hostname=wrongway-tuning quiet splash --
    initrd /casper/initrd.lz
}
menuentry "WrongWay Tuning Live (basic graphics)" {
    search --no-floppy --file --set=root /casper/zz-wrongway.squashfs
    linux /casper/vmlinuz boot=casper persistent username=wrongway hostname=wrongway-tuning nomodeset --
    initrd /casper/initrd.lz
}
